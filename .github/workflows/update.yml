name: Update packages

on:
  schedule:
    # Nightly at 03:00 UTC.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to update, or all"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - depot
          - dexter
          - honeybadger-cli
          - honeybadger-mcp-server
          - playwright-cli
          - tidewave-cli

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - depot
          - dexter
          - honeybadger-cli
          - honeybadger-mcp-server
          - playwright-cli
          - tidewave-cli

    steps:
      - name: Skip unselected package
        if: github.event_name == 'workflow_dispatch' && inputs.package != 'all' && inputs.package != matrix.package
        run: echo "Skipping ${{ matrix.package }}"

      - uses: actions/checkout@v6
        if: github.event_name != 'workflow_dispatch' || inputs.package == 'all' || inputs.package == matrix.package
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: cachix/install-nix-action@v31
        if: github.event_name != 'workflow_dispatch' || inputs.package == 'all' || inputs.package == matrix.package
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update package
        if: github.event_name != 'workflow_dispatch' || inputs.package == 'all' || inputs.package == matrix.package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          args_file="packages/${{ matrix.package }}/nix-update-args"
          args=()
          if [[ -f "$args_file" ]]; then
            while IFS= read -r arg; do
              [[ -z "$arg" || "$arg" =~ ^[[:space:]]*# ]] && continue
              args+=("$arg")
            done < "$args_file"
          fi

          nix run nixpkgs#nix-update -- "${args[@]}" "${{ matrix.package }}"

      - name: Create pull request
        id: pull-request
        if: github.event_name != 'workflow_dispatch' || inputs.package == 'all' || inputs.package == matrix.package
        uses: peter-evans/create-pull-request@v8
        with:
          branch: update/${{ matrix.package }}
          delete-branch: true
          commit-message: "chore(deps): update ${{ matrix.package }}"
          title: "chore(deps): update ${{ matrix.package }}"
          body: |
            Automated package update produced by `nix-update`.

            Package: `${{ matrix.package }}`
          labels: dependencies, automated

      - name: Approve package Check run
        if: steps.pull-request.outputs.pull-request-operation == 'created' || steps.pull-request.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_HEAD_SHA: ${{ steps.pull-request.outputs.pull-request-head-sha }}
        run: |
          set -euo pipefail

          for ((check_attempt = 0; check_attempt < 30; check_attempt++)); do
            check_run=$(gh run list --workflow check.yml --event pull_request \
              --commit "$PR_HEAD_SHA" --limit 1 \
              --json databaseId,status,conclusion \
              --jq '.[0] | [.databaseId, .status, .conclusion] | @tsv')
            IFS=$'\t' read -r check_run_id check_status check_conclusion <<< "$check_run"

            if [[ "$check_conclusion" == 'action_required' ]]; then
              gh api --method POST "repos/$GH_REPO/actions/runs/$check_run_id/approve"
              exit 0
            fi

            if [[ "$check_status" == 'in_progress' || "$check_status" == 'completed' ]]; then
              exit 0
            fi

            sleep 2
          done

          echo '::error::Timed out waiting for the package pull request Check run'
          exit 1
